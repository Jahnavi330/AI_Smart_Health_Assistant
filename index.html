<!DOCTYPE html>
<html>
<head>
  <title>HealthCare AI</title>
  <link rel="stylesheet" href="index.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

</head>
<body onload="locationAlert()">

<header class="header">
  <div class="left-section">
    <button class="icon-btn" id="menuBtn"><i class="fas fa-bars"></i></button>
  <h2 class="title">Smart AI Health Care</h2>
  </div>
   <a href="#" class="emergency-btn pulse" onclick="confirmEmergency()"><i class="fas fa-triangle-exclamation"></i> Emergency</a>
   <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
</header>
<main class="content">

<div class="search-container">

  <input type="text" id="searchText" placeholder="Enter symptoms .....(e.g. fever, cold)" id="searchText">

  <!-- Camera capture -->
  <label for="cameraInput" class="image-btn" title="Open Camera"><i class="fas fa-camera"></i></label>
  <input type="file" id="cameraInput" accept="image/*" capture="environment" hidden>

  <button onclick="handleSearch()">Search</button>
  
</div>

<div id="resultCard" class="result-card" style="display:none;">
  <h3 id="diseaseName"></h3>
  <p id="diseaseInfo"></p>
</div>

<div id="map-section" style="display:none; margin-top:20px;">
  <h3><i class="fas fa-hospital"></i> Nearby Hospitals</h3>
  <iframe
    id="maps-frame"
    width="64%"
    height="400"
    style="border:0; border-radius:12px;"
    loading="lazy">
  </iframe>
</div>
<!-- Floating Chatbot Widget -->
<div class="chatbot-container" id="chatbotContainer">
  <!-- Interactive Trigger Badge -->
  <button class="chat-toggle-btn" id="chatToggleBtn" onclick="toggleChat()" aria-label="Open Health Assistant">
    <i class="fas fa-comment-medical"></i>
    <span class="pulse-ring"></span>
  </button>

  <!-- Complete Chat Window Architecture -->
  <div class="chat-window" id="chatWindow" style="display: none;">
    <div class="chat-header">
      <div class="chat-bot-profile">
        <div class="avatar-status">
          <i class="fas fa-user-md"></i>
          <span class="status-dot online"></span>
        </div>
        <div>
          <h4>Smart Health AI</h4>
          <small>Medical Assistant AI</small>
        </div>
      </div>
      <button class="chat-close-btn" onclick="toggleChat()" aria-label="Close Chat"><i class="fas fa-times"></i></button>
    </div>
    
    <div class="chat-messages" id="chatMessages">
      <div class="message bot-msg">
        <i class="fas fa-robot msg-icon"></i>
        <div class="msg-text">Hello! I am your AI health assistant. Feel free to ask general questions about symptoms, wellness, or healthy habits. How can I help you today?</div>
      </div>
    </div>

    <div class="chat-input-area">
      <input type="text" id="chatInput" placeholder="Ask about symptoms, remedies..." onkeypress="handleChatKey(event)" autocomplete="off">
      <button onclick="sendChatMessage(event)" id="chatSendBtn" title="Send Message"><i class="fas fa-paper-plane"></i></button>
    </div>
  </div>
</div>

<!-- Include Markdown parsing script inside head or before this widget for rendering rich text formatting -->

</main>

<div class="menu-container" id="menuContainer">
  <div onclick="changeCategory('public')"><i class="fas fa-hospital"></i> Public Hospitals</div>
  <div onclick="changeCategory('private')"><i class="fas fa-hotel"></i> Private Hospitals</div>
  <div onclick="changeCategory('clinic')"><i class="fas fa-vial"></i> Clinics</div>
</div>
<script src="script.js"></script>

</body>
</html>
